# CampusOS — Supabase PostgreSQL (Production) — Render + Supabase + Cloudinary
# This file is loaded via spring.profiles.active=prod on Render.
# Set these env vars in Render → Environment:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://db.<project>.supabase.co:5432/postgres?sslmode=require
#   SPRING_DATASOURCE_USERNAME=postgres
#   SPRING_DATASOURCE_PASSWORD=<supabase-db-password>
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
#   JWT_SECRET (optional, if externalised)

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase is Postgres — keep schema auto-managed but never drop in prod
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Pool sizing for Render free/standard
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Ensure Cloudinary and mail still pick up env in prod
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Server port injected by Render
server.port=${PORT:8080}
server.error.include-message=always
