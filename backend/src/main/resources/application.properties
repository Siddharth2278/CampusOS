spring.application.name=backend

# Uses environment variables when set (Render will provide these in
# production); falls back to your local MySQL for everyday local dev.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/campusos}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

# Back to normal — the earlier one-time schema rebuild is done.
# NEVER set this to "create" in production: it drops and recreates
# every table (wiping all data) on every restart.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.web.resources.static-locations=file:uploads/
server.error.include-message=always
server.error.include-binding-errors=always

# Render assigns the port dynamically via this env var.
server.port=${PORT:8080}



# ---------- Password-reset SMTP (Gmail) ----------
# Use a Gmail address in MAIL_USERNAME and a Google App Password in MAIL_PASSWORD.
# Do NOT use the normal Gmail account password for SMTP authentication.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.config.import=optional:classpath:application-local.properties
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.test-connection=false
